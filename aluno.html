<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Estudante — Pão de Verdade</title>
  <link rel="stylesheet" href="assets/css/style.min.css?v=1">
  <style>
    .student-page { min-height: 70vh; padding: 64px 24px 80px; }
    .student-back { color: var(--text-soft); font-size: .9rem; font-weight: 700; }
    .student-back:hover { color: var(--accent); }
    .student-card { max-width: 760px; margin: 0 auto; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 42px; box-shadow: var(--shadow); }
    .student-card h1 { font-family: var(--serif); font-size: clamp(2.1rem, 5vw, 3.2rem); line-height: 1.1; margin: 10px 0 8px; }
    .student-card .intro { color: var(--text-soft); margin-bottom: 30px; font-size: 1.05rem; }
    .student-welcome { padding-bottom: 28px; border-bottom: 1px solid var(--line); }
    .student-status { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 8px 13px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .86rem; font-weight: 700; }
    .student-section { margin-top: 30px; }
    .student-section h2 { font-family: var(--serif); font-size: 1.5rem; margin-bottom: 14px; }
    .student-feature { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px; border-radius: 12px; background: var(--accent); color: var(--white); }
    .student-feature h3 { font-family: var(--serif); font-size: 1.35rem; margin-bottom: 4px; }
    .student-feature p { color: #E9DDD0; font-size: .92rem; }
    .student-feature a { flex: 0 0 auto; background: var(--white); color: var(--accent); padding: 11px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; }
    .student-feature a:hover { background: #F3EDE3; color: var(--accent-dark); }
    .student-materials { border-top: 1px solid var(--line); }
    .student-material { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .student-material h3 { font-size: 1rem; margin-bottom: 3px; }
    .student-material p { color: var(--text-soft); font-size: .88rem; }
    .student-material a { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .student-notice { margin-top: 30px; padding: 24px; border-radius: 12px; background: #F8F1E7; color: var(--text); white-space: pre-line; }
    .student-notice h2 { font-family: var(--serif); font-size: 1.5rem; margin-bottom: 8px; }
    .student-note-intro { color: var(--text-soft); font-size: .92rem; margin-bottom: 12px; }
    .student-error { text-align: center; color: #9B2C2C; background: #FFF0F0; padding: 18px; border-radius: var(--radius); }
    .login-label { display: block; font-size: .88rem; font-weight: 700; color: var(--text); margin: 0 0 8px; }
    .login-input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; font: 1rem var(--sans); color: var(--text); box-sizing: border-box; margin-bottom: 14px; }
    .login-input:focus { outline: none; border-color: var(--accent); }
    .login-btn { width: 100%; padding: 15px; background: var(--cta); color: #fff; border: none; border-radius: 999px; font: 700 1rem var(--sans); cursor: pointer; transition: background .15s ease; }
    .login-btn:hover { background: var(--cta-dark); }
    .login-btn:disabled { opacity: .6; cursor: default; }
    .login-msg { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); font-size: .92rem; line-height: 1.45; }
    .login-success { background: #EAF6EC; color: #2E7D32; }
    .login-warn { background: #FDF3E3; color: #8A5A00; }
    .login-error { background: #FFF0F0; color: #9B2C2C; }
    .student-copy { background: var(--accent); color: var(--white); border: none; border-radius: 999px; padding: 11px 16px; font: 700 .9rem var(--sans); cursor: pointer; white-space: nowrap; }
    .student-copy:hover { background: var(--accent-dark); }
    .student-invite { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
    .student-invite a { background: var(--accent-soft); color: var(--accent); padding: 11px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; text-decoration: none; }
    .student-invite a:hover { background: var(--accent); color: var(--white); }
    .student-credit { margin-top: 26px; padding: 22px; border-radius: 12px; background: #EAF6EC; border: 1px solid #CBE7D0; }
    .student-credit h2 { font-family: var(--serif); font-size: 1.3rem; margin-bottom: 6px; color: #2E7D32; }
    .student-credit p { color: var(--text); font-size: .95rem; }
    .student-credit .code { display: inline-block; margin: 8px 0 4px; padding: 8px 14px; border: 1px dashed #9CCC9F; border-radius: 8px; font-weight: 800; letter-spacing: .05em; color: #1B5E20; background: #fff; }
    .student-cross { margin-top: 26px; padding: 24px; border-radius: 12px; background: #FDF6EC; border: 1px solid #F0DFC2; }
    .student-cross h2 { font-family: var(--serif); font-size: 1.35rem; margin-bottom: 6px; }
    .student-cross .preco { font-weight: 800; color: var(--accent); }
    .student-cross .btn-group { margin-top: 14px; }
    .student-cancel { margin-top: 12px; color: var(--text-soft); font-size: .82rem; font-weight: 700; text-decoration: underline; cursor: pointer; background: none; border: none; font-family: var(--sans); padding: 0; }
    .student-cancel:hover { color: #C62828; }
    .student-cancel:disabled { opacity: .6; cursor: default; }
    .student-support { position: fixed; right: 22px; bottom: 22px; z-index: 60; display: inline-flex; align-items: center; gap: 9px; background: #25D366; color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: .92rem; box-shadow: 0 8px 24px rgba(0,0,0,.22); text-decoration: none; }
    .student-support:hover { background: #1DA851; color: #fff; }
    .pdv-metodo { margin-top: 30px; border: 1px solid var(--line); border-radius: 14px; padding: 24px; background: #FCFAF6; }
    .pdv-metodo-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .pdv-metodo h3 { font-family: var(--serif); font-size: 1.4rem; margin: 0; }
    .pdv-metodo h4 { font-family: var(--serif); font-size: 1.05rem; margin: 0 0 10px; }
    .pdv-reset { background: none; border: none; color: var(--text-soft); font: 700 .8rem var(--sans); cursor: pointer; text-decoration: underline; padding: 4px; }
    .pdv-reset:hover { color: #C62828; }
    .pdv-passos { display: flex; list-style: none; margin: 0 0 18px; padding: 0; gap: 6px; }
    .pdv-passos li { flex: 1; text-align: center; padding: 9px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--text-soft); font: 700 .8rem var(--sans); }
    .pdv-passos li.on { background: var(--accent); color: #fff; }
    .pdv-passos li.done { background: #EAF6EC; color: #2E7D32; }
    .pdv-anel-wrap { position: relative; width: clamp(150px, 44vw, 230px); height: clamp(150px, 44vw, 230px); margin: 0 auto; }
    .pdv-anel { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .pdv-anel-bg { fill: none; stroke: var(--accent-soft); stroke-width: 6; }
    .pdv-anel-fg { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .pdv-relogio { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1; text-align: center; color: var(--accent); letter-spacing: .02em; }
    .pdv-proximo { text-align: center; color: var(--text-soft); font-size: .95rem; font-weight: 700; margin: 8px 0 18px; }
    .pdv-alerta { position: fixed; inset: 0; z-index: 200; background: rgba(74, 46, 27, .55); display: flex; align-items: center; justify-content: center; padding: 24px; animation: pdvFade .18s ease; }
    .pdv-alerta-inner { background: #FFF8F0; border-radius: 22px; max-width: 520px; width: 100%; padding: 40px 32px; text-align: center; box-shadow: 0 24px 70px rgba(33, 33, 33, .4); animation: pdvPop .22s ease; }
    .pdv-alerta-kicker { font-weight: 700; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    .pdv-alerta-titulo { font-family: var(--serif); font-size: clamp(2.2rem, 9vw, 3.8rem); line-height: 1.05; color: var(--accent); margin-bottom: 14px; animation: pdvPulse 1.1s ease-in-out infinite; }
    .pdv-alerta-msg { color: var(--text); font-size: 1.02rem; line-height: 1.5; margin-bottom: 22px; }
    .pdv-alerta-btn { background: var(--cta); color: #fff; border: none; border-radius: 999px; padding: 14px 30px; font: 700 1rem var(--sans); cursor: pointer; }
    .pdv-alerta-btn:hover { background: var(--cta-dark); }
    @keyframes pdvFade { from { opacity: 0; } }
    @keyframes pdvPop { from { transform: scale(.9); opacity: 0; } }
    @keyframes pdvPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .pdv-banner { margin-bottom: 16px; padding: 12px 14px; border-radius: var(--radius); background: #FDF3E3; color: #8A5A00; font-size: .92rem; font-weight: 700; }
    .pdv-blocos { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
    .pdv-bloco { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .pdv-bloco ul { list-style: none; margin: 0; padding: 0; }
    .pdv-bloco li { margin-bottom: 8px; }
    .pdv-bloco li:last-child { margin-bottom: 0; }
    .pdv-bloco label { display: flex; align-items: flex-start; gap: 9px; font-size: .9rem; cursor: pointer; line-height: 1.4; }
    .pdv-bloco input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); width: 17px; height: 17px; flex: 0 0 auto; }
    .pdv-dica { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--text-soft); font-size: .88rem; line-height: 1.45; }
    .pdv-receita { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed var(--line); }
    .pdv-receita:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }
    .pdv-receita-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .pdv-receita-top h5 { font-family: var(--serif); font-size: 1.12rem; margin: 0; }
    .pdv-receita-nota { color: var(--text-soft); font-size: .78rem; font-weight: 700; text-align: right; }
    .pdv-receita-ctrl { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-bottom: 6px; font-size: .86rem; font-weight: 700; color: var(--text); }
    .pdv-receita-ctrl label { display: flex; align-items: center; gap: 6px; }
    .pdv-receita-ctrl button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--accent); font: 700 1rem var(--sans); cursor: pointer; line-height: 1; }
    .pdv-receita-ctrl button:hover { border-color: var(--accent); background: var(--accent-soft); }
    .pdv-receita-ctrl input { width: 56px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: 700 .9rem var(--sans); text-align: center; color: var(--text); }
    .pdv-receita-ctrl input:focus { outline: none; border-color: var(--accent); }
    .pdv-receita-resumo { font-size: .86rem; color: var(--accent); font-weight: 800; margin: 0 0 4px; }
    .pdv-receita-hint { font-size: .78rem; color: var(--text-soft); margin: 0 0 10px; line-height: 1.4; }
    .pdv-receita-vazio { color: var(--text-soft); font-size: .9rem; margin: 0; }
    .pdv-grupo-nome { font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); margin: 12px 0 4px; }
    .pdv-grupo-nome.pdv-pre { display: inline-block; padding: 6px 10px; border-radius: 8px; background: #FDF3E3; color: #8A5A00; border: 1px solid #F0DFC2; margin: 14px 0 8px; text-transform: none; letter-spacing: .02em; }
    .pdv-pre-note { margin: 2px 0 14px; padding: 9px 12px; border-radius: 8px; background: #FFF7E8; border: 1px dashed #E0B04A; color: #8A5A00; font-size: .82rem; font-weight: 700; }
    .pdv-tabela { width: 100%; border-collapse: collapse; font-size: .86rem; margin-bottom: 6px; }
    .pdv-tabela th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: var(--text-soft); padding: 4px 6px; border-bottom: 1px solid var(--line); }
    .pdv-tabela th + th, .pdv-tabela td + td { text-align: right; }
    .pdv-tabela td { padding: 5px 6px; border-bottom: 1px solid #F0E8DC; }
    .pdv-tabela tr:last-child td { border-bottom: 0; }
    .pdv-tabela .sub td { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; }
    .pdv-tabela label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; line-height: 1.4; }
    .pdv-tabela input[type="checkbox"] { margin-top: 3px; accent-color: var(--accent); width: 15px; height: 15px; flex: 0 0 auto; }
    .pdv-pct { width: 58px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font: 700 .85rem var(--sans); text-align: right; color: var(--accent); background: #fff; }
    .pdv-pct:focus { outline: none; border-color: var(--accent); }
    .pdv-start { width: 100%; padding: 15px; background: var(--cta); color: #fff; border: none; border-radius: 999px; font: 700 1rem var(--sans); cursor: pointer; }
    .pdv-start:hover { background: var(--cta-dark); }
    .pdv-start[hidden] { display: none; }
    .pdv-testar { width: 100%; margin-top: 10px; padding: 13px; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; font: 700 .92rem var(--sans); cursor: pointer; }
    .pdv-testar:hover { background: var(--accent-soft); }
    .pdv-tabs { display: flex; gap: 4px; background: var(--accent-soft); border-radius: 999px; padding: 4px; margin-bottom: 18px; }
    .pdv-tab { flex: 1; border: none; background: transparent; color: var(--text-soft); font: 800 .82rem var(--sans); padding: 10px; border-radius: 999px; cursor: pointer; }
    .pdv-tab:hover { color: var(--accent); }
    .pdv-tab.on { background: #fff; color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .pdv-view[hidden] { display: none; }
    .pdv-view { margin-bottom: 18px; }
    .pdv-rec-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .pdv-rec-label { flex-basis: 100%; font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); margin: 2px 0 2px; }
    .pdv-rec-chip { display: inline-flex; flex-direction: column; align-items: center; gap: 1px; border: 1px solid var(--line); background: #fff; color: var(--text); font: 700 .85rem var(--sans); padding: 9px 14px; border-radius: 12px; cursor: pointer; }
    .pdv-rec-chip:hover { border-color: var(--accent); }
    .pdv-rec-chip-nome { font-weight: 800; }
    .pdv-rec-chip-fer { font-size: .72rem; font-weight: 600; color: var(--text-soft); }
    .pdv-rec-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pdv-rec-chip.on .pdv-rec-chip-fer { color: #fff; opacity: .9; }
    .pdv-dobras { margin-bottom: 18px; }
    .pdv-som-status { margin-top: 10px; padding: 10px 12px; border-radius: var(--radius); font-size: .85rem; font-weight: 700; }
    .pdv-som-status.ok { background: #EAF6EC; color: #2E7D32; }
    .pdv-som-status.erro { background: #FFF0F0; color: #9B2C2C; }
    @media (max-width: 600px) { .student-page { padding: 40px 16px 56px; } .student-card { padding: 28px 20px; } .student-feature, .student-material { align-items: flex-start; flex-direction: column; } .student-feature a { width: 100%; text-align: center; } .student-support { right: 12px; bottom: 12px; padding: 11px 14px; font-size: .85rem; } .pdv-blocos { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="site-header">
      <div class="header-inner">
      <a href="index.html" class="brand"><img src="assets/img/marca-preta.png" alt="Pão de Verdade — Forneria Artesanal"></a>
      <a href="index.html" class="student-back">Voltar ao site</a>
    </div>
  </header>

  <main class="student-page">
    <section class="student-card" id="studentCard">
      <span class="kicker left">Pão de Verdade</span>
      <h1>Área do Estudante</h1>
      <p class="intro">Carregando seus materiais…</p>
    </section>
  </main>

  <footer class="site-footer"><div class="footer-inner"><div class="footer-bottom">© <span id="year"></span> Pão de Verdade. Todos os direitos reservados.</div></div></footer>

  <script src="assets/js/metodo.min.js?v=3"></script>
  <script>
    (function () {
      var endpoint = 'https://script.google.com/macros/s/AKfycbxHyN1-ZU49ZH4wU92MHw8PlgLayxVSiszJ7iGG47jdampR5CrTDK2hmo4OH0koPaKRtQ/exec';
      var token = new URLSearchParams(window.location.search).get('token');
      var card = document.getElementById('studentCard');
      document.getElementById('year').textContent = new Date().getFullYear();

      var flags = null;
      var flagsFetched = false;
      function featureOn(nome) { return !flags || flags[nome] !== false; }
      function carregarFlags() {
        if (flagsFetched) return;
        flagsFetched = true;
        var cbn = 'pdvFlags' + Math.floor(Math.random() * 1e6);
        window[cbn] = function (res) { delete window[cbn]; flags = res || null; reconciliar(); };
        var s = document.createElement('script');
        s.onerror = function () { delete window[cbn]; flags = null; reconciliar(); };
        s.src = endpoint + '?acao=flags&callback=' + cbn;
        document.body.appendChild(s);
      }
      function reconciliar() {
        if (!flags) return;
        if (!featureOn('cancelamento')) {
          Array.prototype.forEach.call(card.querySelectorAll('.student-cancel, .student-credit'), function (el) {
            if (el.parentNode) el.parentNode.removeChild(el);
          });
        }
        if (!featureOn('crosssell')) {
          Array.prototype.forEach.call(card.querySelectorAll('.student-cross'), function (el) {
            if (el.parentNode) el.parentNode.removeChild(el);
          });
        }
        if (!featureOn('suporte')) {
          var sp = document.querySelector('.student-support');
          if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
        }
      }

      function esc(value) {
        return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function copiarTexto(texto, btn) {
        var ok = function () {
          var ant = btn.textContent;
          btn.textContent = 'Copiado!';
          setTimeout(function () { btn.textContent = ant; }, 1600);
        };
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = texto;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); ok(); } catch (e) {}
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(texto).then(ok, fallback);
        } else {
          fallback();
        }
      }

      function render(data) {
        var aluno = data.aluno;
        var temCurso = (aluno.cursos && aluno.cursos.length) || (aluno.curso);
        var html = '<div class="student-welcome"><span class="kicker left">Sua inscrição</span>' +
          '<h1>Oi, ' + esc(aluno.nome) + '!</h1>' +
          '<p class="intro">' + (temCurso
            ? (aluno.curso
              ? esc(aluno.curso) + (aluno.dataTurma ? ' · turma de ' + esc(aluno.dataTurma) : '')
              : 'Sua vaga está confirmada!')
            : 'Você não tem inscrições ativas no momento.') + '</p>' +
          (temCurso ? '<p class="student-status">✓ Vaga confirmada</p>' : '') + '</div>';

        function blocoCurso(c) {
          var grupo = c.grupo ? '<a href="' + esc(c.grupo) + '" target="_blank" rel="noopener">Entrar no grupo da turma →</a>' : '<p>O link do grupo será liberado em breve.</p>';
          var apostila = c.apostila ? '<a href="' + esc(c.apostila) + '" target="_blank" rel="noopener">Abrir apostila →</a>' : '<p>Será liberada antes da oficina.</p>';
          var certificado = c.certificado ? '<a href="' + esc(c.certificado) + '" target="_blank" rel="noopener">Baixar certificado →</a>' : '<p>Disponível depois da oficina.</p>';
          var aviso = c.aviso ? '<div class="student-notice"><h2>Antes de vir</h2><p class="student-note-intro">Alguns detalhes simples para você aproveitar bem a oficina.</p>' + esc(c.aviso) + '</div>' : '';
          var cancelBtn = '';
          if (featureOn('cancelamento') && c.pedido && c.pago && !c.concluido) {
            var d = diasAte(c.dataTurma);
            if (d !== null && d >= 5) {
              cancelBtn = '<p><button type="button" class="student-cancel" data-pedido="' + esc(c.pedido) + '">Cancelar e virar crédito →</button></p>';
            } else if (d !== null && d >= 0) {
              cancelBtn = '<p class="small" style="color:var(--text-soft);margin-top:10px">Faltam menos de 5 dias para a oficina. Para cancelar, chama a gente no WhatsApp (botão de suporte).</p>';
            }
          }
          var massa = featureOn('metodo')
            ? '<div class="pdv-metodo-host" data-curso="' + esc(norm(c.curso)) + '"></div>'
            : '';
          return '<section class="student-section">' +
            '<h2>Curso de ' + esc(c.curso) + (c.dataTurma ? ' · ' + esc(c.dataTurma) : '') + '</h2>' +
            '<div class="student-feature"><div><h3>Grupo da turma</h3><p>Combine os últimos detalhes e acompanhe os recados da oficina.</p></div>' + grupo + '</div>' +
            '<div class="student-materials">' +
            '<div class="student-material"><div><h3>Apostila</h3><p>Conteúdo para acompanhar e consultar depois da aula.</p></div>' + apostila + '</div>' +
            '<div class="student-material"><div><h3>Certificado</h3><p>Seu registro de participação na oficina.</p></div>' + certificado + '</div>' +
            '</div>' + aviso + cancelBtn + massa + '</section>';
        }

        if (aluno.cursos && aluno.cursos.length) {
          html += aluno.cursos.map(blocoCurso).join('');
        } else if (aluno.curso) {
          html += blocoCurso({
            curso: aluno.curso, dataTurma: aluno.dataTurma, pedido: aluno.pedido, grupo: aluno.grupo,
            apostila: aluno.apostila, certificado: aluno.certificado, aviso: aluno.aviso
          });
        }

        var convite = aluno.codigoConvite || '';
        var credito = Number(aluno.credito || 0);
        if (convite) {
          var msgConvite = 'Eu garanti minha vaga nas oficinas do Pão de Verdade! 🍞🍕 Use meu código de convite e ganhe 15% de desconto: ' + convite;
          html += '<section class="student-section">' +
            '<h2>Convidar alguém e ganhar 15%</h2>' +
            '<div class="student-feature"><div><h3>Leve alguém junto</h3><p>Quem usar o seu código ganha <strong>15% de desconto</strong> na inscrição. E você ganha <strong>15% de crédito</strong> para o seu próximo curso.</p></div></div>' +
            '<div class="student-material"><div><h3>Seu código de convite</h3><p><strong>' + esc(convite) + '</strong></p></div>' +
            '<button type="button" class="student-copy" id="copyConvite">Copiar código</button></div>' +
            '<div class="student-invite">' +
            '<a href="https://wa.me/?text=' + encodeURIComponent(msgConvite) + '" target="_blank" rel="noopener">Enviar no WhatsApp →</a>' +
            '<button type="button" class="student-copy" id="copyMsg">Copiar mensagem</button>' +
            '</div>' +
            (credito > 0 ? '<div class="student-material"><div><h3>Seu crédito</h3><p>Você tem <strong>R$ ' + credito.toFixed(2) + '</strong> de crédito para o próximo curso. Use o seu código na hora de pagar no site e o desconto é aplicado.</p></div></div>' : '') +
            '</section>';
        }
        card.innerHTML = html;
        var btnCopy = document.getElementById('copyConvite');
        if (btnCopy) btnCopy.addEventListener('click', function () { copiarTexto(convite, btnCopy); });
        var btnMsg = document.getElementById('copyMsg');
        if (btnMsg) btnMsg.addEventListener('click', function () { copiarTexto(msgConvite, btnMsg); });
        montarExtras(aluno);
        montarMassas();
      }

      var dadosMetodo = null;
      var dadosMetodoCarregando = false;
      function carregarMetodo() {
        if (dadosMetodo || dadosMetodoCarregando) return;
        dadosMetodoCarregando = true;
        var cb = 'pdvMetodo' + Math.floor(Math.random() * 1e6);
        window[cb] = function (res) {
          delete window[cb];
          dadosMetodoCarregando = false;
          if (res && res.ok) { dadosMetodo = res; montarMassas(); }
        };
        var s = document.createElement('script');
        s.onerror = function () {
          delete window[cb];
          dadosMetodoCarregando = false;
        };
        s.src = endpoint + '?acao=metodo&callback=' + cb;
        document.body.appendChild(s);
      }

      function montarMassas() {
        if (!dadosMetodo || !window.PDVMetodo) return;
        Array.prototype.forEach.call(card.querySelectorAll('.pdv-metodo-host'), function (host) {
          var curso = host.getAttribute('data-curso');
          window.PDVMetodo.montar(host, curso, dadosMetodo.receitas && dadosMetodo.receitas[curso], dadosMetodo.metodo, { endpoint: endpoint, tts: dadosMetodo.tts });
        });
      }

      function norm(s) {
        return String(s || '').trim().toLowerCase()
          .replace(/[àáâãä]/g, 'a').replace(/[éèêë]/g, 'e').replace(/[íìîï]/g, 'i')
          .replace(/[óòôõö]/g, 'o').replace(/[úùûü]/g, 'u').replace(/ç/g, 'c');
      }
      function diasAte(dataTurma) {
        try {
          var p = String(dataTurma || '').split('/');
          var dt = new Date(Number(p[2]), Number(p[1]) - 1, Number(p[0]));
          return (dt.getTime() - Date.now()) / (24 * 60 * 60 * 1000);
        } catch (e) { return null; }
      }

      function montarExtras(aluno) {
        if (featureOn('cancelamento') && aluno.creditoCodigo && Number(aluno.creditoValor || 0) > 0) {
          var blk = document.createElement('div');
          blk.className = 'student-credit';
          blk.innerHTML = '<h2>💛 Seu crédito</h2>' +
            '<p>Você tem <strong>R$ ' + Number(aluno.creditoValor).toFixed(2) + '</strong> de crédito. Use o código abaixo no checkout de qualquer próxima turma:</p>' +
            '<p class="code">' + esc(aluno.creditoCodigo) + '</p>' +
            '<div class="student-invite"><button type="button" class="student-copy" id="copyCredito">Copiar código</button></div>';
          card.appendChild(blk);
          var b = document.getElementById('copyCredito');
          if (b) b.addEventListener('click', function () { copiarTexto(aluno.creditoCodigo, b); });
        }

        if (featureOn('cancelamento')) {
          Array.prototype.forEach.call(card.querySelectorAll('.student-cancel'), function (btn) {
            btn.addEventListener('click', function () { cancelarPedido(btn.getAttribute('data-pedido'), btn); });
          });
        }

        if (featureOn('crosssell')) carregarTurmas(aluno);
      }

      function carregarTurmas(aluno) {
        var cb = 'pdvTurmas' + Math.floor(Math.random() * 1e6);
        window[cb] = function (res) {
          delete window[cb];
          if (Array.isArray(res)) crossSell(aluno, res);
        };
        var s = document.createElement('script');
        s.onerror = function () { delete window[cb]; };
        s.src = endpoint + '?acao=turmas&callback=' + cb;
        document.body.appendChild(s);
      }

      function crossSell(aluno, turmas) {
        var inscritos = {};
        (aluno.cursos || []).forEach(function (c) { inscritos[norm(c.curso)] = true; });
        if (aluno.curso) inscritos[norm(aluno.curso)] = true;
        if (inscritos['pao'] && inscritos['pizza']) return;
        var alvo = inscritos['pao'] ? 'Pizza' : 'Pão';
        var t = null;
        for (var i = 0; i < turmas.length; i++) {
          if (norm(turmas[i].curso) !== norm(alvo)) continue;
          var d = diasAte(turmas[i].dataTurma);
          if (d === null || d < 0) continue;
          if (Number(turmas[i].restantes) > 0) { t = turmas[i]; break; }
        }
        if (!t) return;
        var preco = 275;
        var creditoTotal = Number(aluno.creditoValor || 0);
        var creditoConvite = Number(aluno.credito || 0);
        var emoji = alvo === 'Pizza' ? '🍕' : '🍞';
        var btnCheckout = 'checkout.html?curso=' + encodeURIComponent(alvo) + '&data=' + encodeURIComponent(t.dataTurma);
        var htmlBlk = '<h2>' + emoji + ' ' + (alvo === 'Pizza' ? 'Pizza' : 'Pão') + ' ainda tem vaga</h2>' +
          '<p>' + esc(t.dataTurma) + ' · <span class="preco">R$ ' + preco.toFixed(2) + '</span> por pessoa.</p>';
        if (creditoTotal >= preco) {
          htmlBlk += '<p style="color:#1B5E20;font-weight:700">Com seu crédito de R$ ' + creditoTotal.toFixed(2) + ', essa vaga sai de graça pra você.</p>';
        } else if (creditoTotal > 0) {
          htmlBlk += '<p style="color:#1B5E20;font-weight:700">Seu crédito de R$ ' + creditoTotal.toFixed(2) + ' é aplicado na hora de pagar.</p>';
        } else if (creditoConvite > 0) {
          htmlBlk += '<p style="color:#1B5E20;font-weight:700">Seu crédito de convite de R$ ' + creditoConvite.toFixed(2) + ' é aplicado na hora de pagar.</p>';
        }
        htmlBlk += '<div class="btn-group mt-1">' +
          '<a class="btn btn-primary" href="' + esc(btnCheckout) + '">Garantir vaga na ' + (alvo === 'Pizza' ? 'Pizza' : 'Pão') + ' →</a>' +
          '<a class="btn btn-outline" href="' + (alvo === 'Pizza' ? 'curso-pizza.html' : 'curso-pao.html') + '?data=' + encodeURIComponent(t.dataTurma) + '">Ver curso →</a>' +
          '</div>';
        var blk2 = document.createElement('div');
        blk2.className = 'student-cross';
        blk2.innerHTML = htmlBlk;
        card.appendChild(blk2);
      }

      function cancelarPedido(pedido, btn) {
        if (!confirm('Cancelar sua inscrição e transformar em crédito? A vaga abre para outra pessoa e você ganha crédito para usar em qualquer próxima turma. Seu crédito não expira.')) return;
        btn.disabled = true;
        btn.textContent = 'Cancelando…';
        var cb = 'pdvCancelar' + Date.now();
        window[cb] = function (data) {
          delete window[cb];
          btn.disabled = false;
          if (data && data.ok) {
            carregar(0);
          } else {
            btn.textContent = 'Cancelar e virar crédito →';
            alert((data && data.erro) || 'Não foi possível cancelar agora. Tente de novo ou chama a gente no WhatsApp.');
          }
        };
        var s = document.createElement('script');
        s.onerror = function () {
          delete window[cb];
          btn.disabled = false;
          btn.textContent = 'Cancelar e virar crédito →';
          alert('Verifique sua conexão e tente novamente.');
        };
        s.src = endpoint + '?acao=cancelarpedido&token=' + encodeURIComponent(token) + '&pedido=' + encodeURIComponent(pedido) + '&callback=' + cb;
        document.body.appendChild(s);
      }

      function renderLogin(msg) {
        card.innerHTML = '<span class="kicker left">Pão de Verdade</span>' +
          '<h1>Área do Estudante</h1>' +
          '<p class="intro">Já garantiu sua vaga? Digite o e-mail ou WhatsApp que você usou na inscrição e receba seu acesso por e-mail.</p>' +
          '<label class="login-label" for="loginInput">E-mail ou WhatsApp</label>' +
          '<input class="login-input" type="text" id="loginInput" placeholder="ex.: nome@email.com ou (34) 9 9999-9999" autocomplete="off">' +
          '<button class="login-btn" id="loginBtn" type="button">Receber meu acesso</button>' +
          '<p class="login-msg" id="loginMsg">' + (msg || '') + '</p>';
        document.getElementById('loginBtn').addEventListener('click', enviarAcesso);
        document.getElementById('loginInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') enviarAcesso(); });
        document.getElementById('loginInput').focus();
      }

      function enviarAcesso() {
        var input = document.getElementById('loginInput');
        var msg = document.getElementById('loginMsg');
        var btn = document.getElementById('loginBtn');
        var contato = input.value.trim();
        if (!contato) {
          msg.className = 'login-msg login-error';
          msg.textContent = 'Digite seu e-mail ou WhatsApp.';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Enviando…';
        msg.className = 'login-msg';
        msg.textContent = 'Aguarde um instante…';

        var callback = 'pdvLoginCallback';
        window[callback] = function (data) {
          delete window[callback];
          btn.disabled = false;
          btn.textContent = 'Receber meu acesso';
          if (data.ok) {
            msg.className = 'login-msg login-success';
            msg.textContent = data.msg || 'Enviamos o acesso para o seu e-mail. Confira também a caixa de spam.';
          } else if (data.naoEncontrado) {
            msg.className = 'login-msg login-warn';
            msg.textContent = data.erro || 'Não encontramos sua inscrição. Chama a gente no WhatsApp que a gente resolve!';
          } else {
            msg.className = 'login-msg login-error';
            msg.textContent = data.erro || 'Não foi possível enviar agora. Tente novamente em instantes.';
          }
        };
        var script = document.createElement('script');
        script.onerror = function () {
          delete window[callback];
          btn.disabled = false;
          btn.textContent = 'Receber meu acesso';
          msg.className = 'login-msg login-error';
          msg.textContent = 'Verifique sua conexão e tente novamente.';
        };
        script.src = endpoint + '?acao=reenviar&contato=' + encodeURIComponent(contato) + '&callback=' + callback;
        document.body.appendChild(script);
      }

       if (!token) { renderLogin(); carregarFlags(); return; }
      function carregar(tentativa) {
        var callback = 'pdvAlunoCallback' + tentativa;
        window[callback] = function (data) {
          delete window[callback];
          if (data.ok) { render(data); return; }
          if (tentativa < 2) {
            setTimeout(function () { carregar(tentativa + 1); }, 1500);
            return;
          }
          if (data && data.erro && (String(data.erro).indexOf('inválido') !== -1 || String(data.erro).indexOf('expirado') !== -1)) {
            renderLogin();
            return;
          }
          card.innerHTML = '<h1>Não foi possível abrir</h1><p class="student-error">' + esc(data.erro || 'Não foi possível abrir sua área.') + '</p>';
        };
        var script = document.createElement('script');
        script.onerror = function () {
          delete window[callback];
          if (tentativa < 2) setTimeout(function () { carregar(tentativa + 1); }, 1500);
          else card.innerHTML = '<h1>Não foi possível abrir</h1><p class="student-error">Verifique sua conexão e tente novamente.</p>';
        };
        script.src = endpoint + '?acao=aluno&token=' + encodeURIComponent(token) + '&callback=' + callback;
        document.body.appendChild(script);
      }
      carregar(0);
      carregarFlags();
      carregarMetodo();
    })();
  </script>
  <script>
    (function () {
      var API = 'https://script.google.com/macros/s/AKfycbxHyN1-ZU49ZH4wU92MHw8PlgLayxVSiszJ7iGG47jdampR5CrTDK2hmo4OH0koPaKRtQ/exec';
      var cbn = 'pdvSup' + Math.floor(Math.random() * 1e6);
      window[cbn] = function (res) { delete window[cbn]; if (res && res.suporte === false) return; montar(); };
      var s = document.createElement('script');
      s.onerror = function () { delete window[cbn]; montar(); };
      s.src = API + '?acao=flags&callback=' + cbn;
      document.body.appendChild(s);
      function montar() {
        var msg = 'Oi! Sou aluno do Pão de Verdade e preciso de ajuda na Área do Estudante.';
        var a = document.createElement('a');
        a.className = 'student-support';
        a.href = 'https://wa.me/5534936186847?text=' + encodeURIComponent(msg);
        a.target = '_blank';
        a.rel = 'noopener';
        a.setAttribute('aria-label', 'Falar com suporte no WhatsApp');
        a.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Suporte';
        document.body.appendChild(a);
      }
    })();
  </script>
