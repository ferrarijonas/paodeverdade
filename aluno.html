<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Estudante — Pão de Verdade</title>
  <link rel="stylesheet" href="assets/css/style.min.css?v=1">
  <style>
    .student-page { min-height: 70vh; padding: 64px 24px 80px; }
    .student-back { color: var(--text-soft); font-size: .9rem; font-weight: 700; }
    .student-back:hover { color: var(--accent); }
    .student-card { max-width: 760px; margin: 0 auto; background: var(--white); border: 1px solid var(--line); border-radius: 16px; padding: 42px; box-shadow: var(--shadow); }
    .student-card h1 { font-family: var(--serif); font-size: clamp(2.1rem, 5vw, 3.2rem); line-height: 1.1; margin: 10px 0 8px; }
    .student-card .intro { color: var(--text-soft); margin-bottom: 30px; font-size: 1.05rem; }
    .student-welcome { padding-bottom: 28px; border-bottom: 1px solid var(--line); }
    .student-status { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 8px 13px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: .86rem; font-weight: 700; }
    .student-section { margin-top: 30px; }
    .student-section h2 { font-family: var(--serif); font-size: 1.5rem; margin-bottom: 14px; }
    .student-feature { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px; border-radius: 12px; background: var(--accent); color: var(--white); }
    .student-feature h3 { font-family: var(--serif); font-size: 1.35rem; margin-bottom: 4px; }
    .student-feature p { color: #E9DDD0; font-size: .92rem; }
    .student-feature a { flex: 0 0 auto; background: var(--white); color: var(--accent); padding: 11px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; }
    .student-feature a:hover { background: #F3EDE3; color: var(--accent-dark); }
    .student-materials { border-top: 1px solid var(--line); }
    .student-material { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .student-material h3 { font-size: 1rem; margin-bottom: 3px; }
    .student-material p { color: var(--text-soft); font-size: .88rem; }
    .student-material a { color: var(--accent); font-weight: 700; white-space: nowrap; }
    .student-notice { margin-top: 30px; padding: 24px; border-radius: 12px; background: #F8F1E7; color: var(--text); white-space: pre-line; }
    .student-notice h2 { font-family: var(--serif); font-size: 1.5rem; margin-bottom: 8px; }
    .student-note-intro { color: var(--text-soft); font-size: .92rem; margin-bottom: 12px; }
    .student-error { text-align: center; color: #9B2C2C; background: #FFF0F0; padding: 18px; border-radius: var(--radius); }
    .login-label { display: block; font-size: .88rem; font-weight: 700; color: var(--text); margin: 0 0 8px; }
    .login-input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; font: 1rem var(--sans); color: var(--text); box-sizing: border-box; margin-bottom: 14px; }
    .login-input:focus { outline: none; border-color: var(--accent); }
    .login-btn { width: 100%; padding: 15px; background: var(--cta); color: #fff; border: none; border-radius: 999px; font: 700 1rem var(--sans); cursor: pointer; transition: background .15s ease; }
    .login-btn:hover { background: var(--cta-dark); }
    .login-btn:disabled { opacity: .6; cursor: default; }
    .login-msg { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); font-size: .92rem; line-height: 1.45; }
    .login-success { background: #EAF6EC; color: #2E7D32; }
    .login-warn { background: #FDF3E3; color: #8A5A00; }
    .login-error { background: #FFF0F0; color: #9B2C2C; }
    .student-copy { background: var(--accent); color: var(--white); border: none; border-radius: 999px; padding: 11px 16px; font: 700 .9rem var(--sans); cursor: pointer; white-space: nowrap; }
    .student-copy:hover { background: var(--accent-dark); }
    .student-invite { margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
    .student-invite a { background: var(--accent-soft); color: var(--accent); padding: 11px 16px; border-radius: 999px; font-weight: 700; font-size: .9rem; text-decoration: none; }
    .student-invite a:hover { background: var(--accent); color: var(--white); }
    .student-support { position: fixed; right: 22px; bottom: 22px; z-index: 60; display: inline-flex; align-items: center; gap: 9px; background: #25D366; color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: .92rem; box-shadow: 0 8px 24px rgba(0,0,0,.22); text-decoration: none; }
    .student-support:hover { background: #1DA851; color: #fff; }
    @media (max-width: 600px) { .student-page { padding: 40px 16px 56px; } .student-card { padding: 28px 20px; } .student-feature, .student-material { align-items: flex-start; flex-direction: column; } .student-feature a { width: 100%; text-align: center; } .student-support { right: 12px; bottom: 12px; padding: 11px 14px; font-size: .85rem; } }
  </style>
</head>
<body>
  <header class="site-header">
      <div class="header-inner">
      <a href="index.html" class="brand"><img src="assets/img/marca-preta.png" alt="Pão de Verdade — Forneria Artesanal"></a>
      <a href="index.html" class="student-back">Voltar ao site</a>
    </div>
  </header>

  <main class="student-page">
    <section class="student-card" id="studentCard">
      <span class="kicker left">Pão de Verdade</span>
      <h1>Área do Estudante</h1>
      <p class="intro">Carregando seus materiais…</p>
    </section>
  </main>

  <footer class="site-footer"><div class="footer-inner"><div class="footer-bottom">© <span id="year"></span> Pão de Verdade. Todos os direitos reservados.</div></div></footer>

  <script>
    (function () {
      var endpoint = 'https://script.google.com/macros/s/AKfycbxHyN1-ZU49ZH4wU92MHw8PlgLayxVSiszJ7iGG47jdampR5CrTDK2hmo4OH0koPaKRtQ/exec';
      var token = new URLSearchParams(window.location.search).get('token');
      var card = document.getElementById('studentCard');
      document.getElementById('year').textContent = new Date().getFullYear();

      function esc(value) {
        return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function copiarTexto(texto, btn) {
        var ok = function () {
          var ant = btn.textContent;
          btn.textContent = 'Copiado!';
          setTimeout(function () { btn.textContent = ant; }, 1600);
        };
        function fallback() {
          var ta = document.createElement('textarea');
          ta.value = texto;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); ok(); } catch (e) {}
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(texto).then(ok, fallback);
        } else {
          fallback();
        }
      }

      function render(data) {
        var aluno = data.aluno;
        var html = '<div class="student-welcome"><span class="kicker left">Sua inscrição</span>' +
          '<h1>Oi, ' + esc(aluno.nome) + '!</h1>' +
          '<p class="intro">' + (aluno.curso
            ? esc(aluno.curso) + (aluno.dataTurma ? ' · turma de ' + esc(aluno.dataTurma) : '')
            : 'Sua vaga está confirmada!') + '</p>' +
          '<p class="student-status">✓ Vaga confirmada</p></div>';

        function blocoCurso(c) {
          var grupo = c.grupo ? '<a href="' + esc(c.grupo) + '" target="_blank" rel="noopener">Entrar no grupo da turma →</a>' : '<p>O link do grupo será liberado em breve.</p>';
          var apostila = c.apostila ? '<a href="' + esc(c.apostila) + '" target="_blank" rel="noopener">Abrir apostila →</a>' : '<p>Será liberada antes da oficina.</p>';
          var certificado = c.certificado ? '<a href="' + esc(c.certificado) + '" target="_blank" rel="noopener">Baixar certificado →</a>' : '<p>Disponível depois da oficina.</p>';
          var aviso = c.aviso ? '<div class="student-notice"><h2>Antes de vir</h2><p class="student-note-intro">Alguns detalhes simples para você aproveitar bem a oficina.</p>' + esc(c.aviso) + '</div>' : '';
          return '<section class="student-section">' +
            '<h2>Curso de ' + esc(c.curso) + (c.dataTurma ? ' · ' + esc(c.dataTurma) : '') + '</h2>' +
            '<div class="student-feature"><div><h3>Grupo da turma</h3><p>Combine os últimos detalhes e acompanhe os recados da oficina.</p></div>' + grupo + '</div>' +
            '<div class="student-materials">' +
            '<div class="student-material"><div><h3>Apostila</h3><p>Conteúdo para acompanhar e consultar depois da aula.</p></div>' + apostila + '</div>' +
            '<div class="student-material"><div><h3>Certificado</h3><p>Seu registro de participação na oficina.</p></div>' + certificado + '</div>' +
            '</div>' + aviso + '</section>';
        }

        if (aluno.cursos && aluno.cursos.length) {
          html += aluno.cursos.map(blocoCurso).join('');
        } else {
          html += blocoCurso({
            curso: aluno.curso, dataTurma: aluno.dataTurma, grupo: aluno.grupo,
            apostila: aluno.apostila, certificado: aluno.certificado, aviso: aluno.aviso
          });
        }

        var convite = aluno.codigoConvite || '';
        var credito = Number(aluno.credito || 0);
        if (convite) {
          var msgConvite = 'Eu garanti minha vaga nas oficinas do Pão de Verdade! 🍞🍕 Use meu código de convite e ganhe 15% de desconto: ' + convite;
          html += '<section class="student-section">' +
            '<h2>Convidar alguém e ganhar 15%</h2>' +
            '<div class="student-feature"><div><h3>Leve alguém junto</h3><p>Quem usar o seu código ganha <strong>15% de desconto</strong> na inscrição. E você ganha <strong>15% de crédito</strong> para o seu próximo curso.</p></div></div>' +
            '<div class="student-material"><div><h3>Seu código de convite</h3><p><strong>' + esc(convite) + '</strong></p></div>' +
            '<button type="button" class="student-copy" id="copyConvite">Copiar código</button></div>' +
            '<div class="student-invite">' +
            '<a href="https://wa.me/?text=' + encodeURIComponent(msgConvite) + '" target="_blank" rel="noopener">Enviar no WhatsApp →</a>' +
            '<button type="button" class="student-copy" id="copyMsg">Copiar mensagem</button>' +
            '</div>' +
            (credito > 0 ? '<div class="student-material"><div><h3>Seu crédito</h3><p>Você tem <strong>R$ ' + credito.toFixed(2) + '</strong> de crédito para o próximo curso. Use o seu código na hora de pagar no site e o desconto é aplicado.</p></div></div>' : '') +
            '</section>';
        }
        card.innerHTML = html;
        var btnCopy = document.getElementById('copyConvite');
        if (btnCopy) btnCopy.addEventListener('click', function () { copiarTexto(convite, btnCopy); });
        var btnMsg = document.getElementById('copyMsg');
        if (btnMsg) btnMsg.addEventListener('click', function () { copiarTexto(msgConvite, btnMsg); });
      }

      function renderLogin(msg) {
        card.innerHTML = '<span class="kicker left">Pão de Verdade</span>' +
          '<h1>Área do Estudante</h1>' +
          '<p class="intro">Já garantiu sua vaga? Digite o e-mail ou WhatsApp que você usou na inscrição e receba seu acesso por e-mail.</p>' +
          '<label class="login-label" for="loginInput">E-mail ou WhatsApp</label>' +
          '<input class="login-input" type="text" id="loginInput" placeholder="ex.: nome@email.com ou (34) 9 9999-9999" autocomplete="off">' +
          '<button class="login-btn" id="loginBtn" type="button">Receber meu acesso</button>' +
          '<p class="login-msg" id="loginMsg">' + (msg || '') + '</p>';
        document.getElementById('loginBtn').addEventListener('click', enviarAcesso);
        document.getElementById('loginInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') enviarAcesso(); });
        document.getElementById('loginInput').focus();
      }

      function enviarAcesso() {
        var input = document.getElementById('loginInput');
        var msg = document.getElementById('loginMsg');
        var btn = document.getElementById('loginBtn');
        var contato = input.value.trim();
        if (!contato) {
          msg.className = 'login-msg login-error';
          msg.textContent = 'Digite seu e-mail ou WhatsApp.';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Enviando…';
        msg.className = 'login-msg';
        msg.textContent = 'Aguarde um instante…';

        var callback = 'pdvLoginCallback';
        window[callback] = function (data) {
          delete window[callback];
          btn.disabled = false;
          btn.textContent = 'Receber meu acesso';
          if (data.ok) {
            msg.className = 'login-msg login-success';
            msg.textContent = data.msg || 'Enviamos o acesso para o seu e-mail. Confira também a caixa de spam.';
          } else if (data.naoEncontrado) {
            msg.className = 'login-msg login-warn';
            msg.textContent = data.erro || 'Não encontramos sua inscrição. Chama a gente no WhatsApp que a gente resolve!';
          } else {
            msg.className = 'login-msg login-error';
            msg.textContent = data.erro || 'Não foi possível enviar agora. Tente novamente em instantes.';
          }
        };
        var script = document.createElement('script');
        script.onerror = function () {
          delete window[callback];
          btn.disabled = false;
          btn.textContent = 'Receber meu acesso';
          msg.className = 'login-msg login-error';
          msg.textContent = 'Verifique sua conexão e tente novamente.';
        };
        script.src = endpoint + '?acao=reenviar&contato=' + encodeURIComponent(contato) + '&callback=' + callback;
        document.body.appendChild(script);
      }

       if (!token) { renderLogin(); return; }
      function carregar(tentativa) {
        var callback = 'pdvAlunoCallback' + tentativa;
        window[callback] = function (data) {
          delete window[callback];
          if (data.ok) { render(data); return; }
          if (tentativa < 2) {
            setTimeout(function () { carregar(tentativa + 1); }, 1500);
            return;
          }
          if (data && data.erro && (String(data.erro).indexOf('inválido') !== -1 || String(data.erro).indexOf('expirado') !== -1)) {
            renderLogin();
            return;
          }
          card.innerHTML = '<h1>Não foi possível abrir</h1><p class="student-error">' + esc(data.erro || 'Não foi possível abrir sua área.') + '</p>';
        };
        var script = document.createElement('script');
        script.onerror = function () {
          delete window[callback];
          if (tentativa < 2) setTimeout(function () { carregar(tentativa + 1); }, 1500);
          else card.innerHTML = '<h1>Não foi possível abrir</h1><p class="student-error">Verifique sua conexão e tente novamente.</p>';
        };
        script.src = endpoint + '?acao=aluno&token=' + encodeURIComponent(token) + '&callback=' + callback;
        document.body.appendChild(script);
      }
      carregar(0);
    })();
  </script>
  <script>
    (function () {
      var msg = 'Oi! Sou aluno do Pão de Verdade e preciso de ajuda na Área do Estudante.';
      var a = document.createElement('a');
      a.className = 'student-support';
      a.href = 'https://wa.me/5534936186847?text=' + encodeURIComponent(msg);
      a.target = '_blank';
      a.rel = 'noopener';
      a.setAttribute('aria-label', 'Falar com suporte no WhatsApp');
      a.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> Suporte';
      document.body.appendChild(a);
    })();
  </script>
<script src="assets/js/analytics.min.js"></script>
</body>
</html>
